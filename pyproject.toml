[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-llm-cascade"
version = "0.1.0"
description = "Autonomous interactive AI developer assistant with multi-model fallback cascade"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [ { name = "mikako" } ]

dependencies = [
    "litellm==1.81.13",
    "openai>=1.0.0",
    "groq>=0.4.0",
    "mistralai>=0.1.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
     "ddgs>=7.0.0",
    "crawl4ai>=0.4.0",
    "playwright>=1.40.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]

[project.scripts]
cascade = "main:main"

[tool.setuptools]
py-modules = [
    "agent",
    "app_paths",
    "cli_controller",
    "config",
    "config_loader",
    "config_wizard",
    "context_utils",
    "env_utils",
    "file_utils",
    "main",
    "memory_manager",
    "policy",
    "sandbox_runner",
    "schemas",
    "system_prompt_manager",
    "tools",
]

[tool.setuptools.package-data]
"*" = ["memory/**/*"]

